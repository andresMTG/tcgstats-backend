services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcgstats-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: tcgstats-backend
      AUTH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DSN: "host=postgres user=${POSTGRES_USER:-tcgstats} password=${POSTGRES_PASSWORD:-tcgstats} dbname=${POSTGRES_DB:-tcgstats} port=5432 sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env}
      REDIS_ADDR: redis:6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: tcgstats-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcgstats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcgstats}
      POSTGRES_USER: ${POSTGRES_USER:-tcgstats}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tcgstats-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
